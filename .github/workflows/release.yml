name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify tag version
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'));
          assert.equal(process.env.GITHUB_REF_NAME, `v${pkg.version}`);
          NODE
      - name: Package and publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          archive=$(npm pack --ignore-scripts --json | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8'))[0].filename")
          gh release create "$GITHUB_REF_NAME" "$archive" --verify-tag --title "$GITHUB_REF_NAME" --notes-file RELEASE_NOTES.md
